name: Publish CLI

# Publishes `packages/cli` (the `fakturky` binary) to npm with provenance when a `cli-v<version>` tag is pushed.
# Needs the repository secret NPM_TOKEN (npm "Automation" or granular token with publish rights).
# Release: bump packages/cli/package.json, merge, then `git tag cli-v0.1.0 && git push origin cli-v0.1.0`.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main; refusing to publish unmerged code" >&2
            exit 1
          fi
      - name: Tag must match the package version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "cli-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/cli version ${version}" >&2
            exit 1
          fi
      - run: pnpm --filter fakturky typecheck
      - run: pnpm vitest run packages/cli
      - run: pnpm --filter fakturky build
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
