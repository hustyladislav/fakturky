<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Jste offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; text-align: center;
        font: 16px/1.5 system-ui, sans-serif; background: #f6f2ea; color: #1b1a17; }
      @media (prefers-color-scheme: dark) { body { background: #121310; color: #eee9dd; } a, button { color: #8cc4a4; } }
      h1 { font: 500 28px/1.2 Georgia, serif; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #6b665b; }
      @media (prefers-color-scheme: dark) { p { color: #9c978a; } }
      button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid currentColor; background: none; color: #1f4d3c; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Jste offline</h1>
      <p>Bez připojení k internetu se faktury nenačtou. Zkuste to prosím znovu, až budete online.</p>
      <button type="button" onclick="location.reload()">Zkusit znovu</button>
    </main>
  </body>
</html>
