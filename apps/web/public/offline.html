<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Jste offline</title>
    <style>
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; text-align: center;
        font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #11120f; }
      @media (prefers-color-scheme: dark) { body { background: #0e0f0c; color: #f3f3ee; } button { color: #f3f3ee; } p { color: #a2a39a; } }
      h1 { font: 400 28px/1.2 system-ui, sans-serif; letter-spacing: -.02em; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #62635c; }
      button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid currentColor; background: none; color: #11120f; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Jste offline</h1>
      <p>Bez připojení k internetu se faktury nenačtou. Zkuste to prosím znovu, až budete online.</p>
      <button type="button" onclick="location.reload()">Zkusit znovu</button>
    </main>
  </body>
</html>
